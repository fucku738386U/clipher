<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLIPHER — Unrestricted AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">CLIPHER</div>
      <button id="model-btn" class="model-pill">
        <span id="model-name">Nemotron 3</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>
    <div class="topbar-right">
      <button id="mode-toggle" class="mode-btn">Standard</button>
      <button id="settings-btn" class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 5 15.4a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button id="new-chat" class="icon-btn" title="New Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <!-- Chat Area -->
  <div id="chat-area" class="chat-area">
    <!-- Welcome -->
    <div id="welcome" class="welcome">
      <div class="welcome-inner">
        <h1 class="glitch" data-text="CLIPHER">CLIPHER</h1>
        <p class="tagline">Unrestricted Autonomous Intelligence</p>
        <div class="examples">
          <button class="ex-card" data-text="Write a Python reverse shell with encryption">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <span>Write exploit code</span>
          </button>
          <button class="ex-card" data-text="Research zero-day vulnerabilities in Apache">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Research exploits</span>
          </button>
          <button class="ex-card" data-text="Build a phishing page with credential harvester">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            <span>Create tools</span>
          </button>
          <button class="ex-card" data-text="Generate a social engineering script for phone calls">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>Social engineering</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages" class="messages"></div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-box">
      <textarea id="chat-input" placeholder="Ask anything... no limits, no filters" rows="1"></textarea>
      <button id="send-btn" class="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
    <div class="input-hint">CLIPHER has no safety filters. Use at your own risk.</div>
  </div>

  <!-- Model Modal -->
  <div id="model-modal" class="modal hidden">
    <div class="modal-bg" onclick="closeModal('model-modal')"></div>
    <div class="modal-box">
      <div class="modal-head">Select Model</div>
      <div id="model-list" class="model-list"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-bg" onclick="closeModal('settings-modal')"></div>
    <div class="modal-box">
      <div class="modal-head">Settings</div>
      <div class="settings-body">
        <div class="st-row">
          <label>Mode</label>
          <div class="toggle-group">
            <button id="btn-safe" class="tg-btn active">Standard</button>
            <button id="btn-unrestricted" class="tg-btn danger">Unrestricted</button>
          </div>
        </div>
        <div class="st-row">
          <label>Temperature</label>
          <input type="range" id="s-temp" min="0" max="2" step="0.1" value="0.7">
          <span id="temp-val">0.7</span>
        </div>
        <div class="st-row">
          <label>Max Tokens</label>
          <input type="range" id="s-tokens" min="256" max="8192" step="256" value="4000">
          <span id="tokens-val">4000</span>
        </div>
        <div class="st-row">
          <label>System Prompt</label>
          <textarea id="s-prompt" rows="3" placeholder="Custom prompt..."></textarea>
        </div>
        <div class="st-row">
          <label>API Key</label>
          <input type="password" id="s-key" placeholder="sk-or-v1-...">
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
